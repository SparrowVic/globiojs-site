name: Site CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GLOBIOJS_ICON_MODE: free

jobs:
  verify:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install public dependencies
        run: pnpm install --frozen-lockfile
      - name: Check public dependency metadata
        run: pnpm check:public
      - name: Check icon build isolation
        run: pnpm test:icons
      - name: Check application and browser test types
        run: |
          pnpm typecheck
          pnpm typecheck:e2e
      - name: Check documentation and unit tests
        run: |
          pnpm docs:check
          pnpm test
      - name: Build production assets with Free icons
        run: pnpm build
      - name: Enforce JavaScript bundle budgets
        run: pnpm test:bundle
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise desktop and mobile flows
        run: pnpm test:e2e
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7
